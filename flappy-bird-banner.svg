<svg width="100%" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- stars -->
  <circle cx="60" cy="30" r="1.5" fill="#00D9C0" opacity="0.8"/>
  <circle cx="200" cy="50" r="1" fill="#6C63FF" opacity="0.8"/>
  <circle cx="450" cy="20" r="1.5" fill="#00D9C0" opacity="0.6"/>
  <circle cx="600" cy="45" r="1" fill="#6C63FF" opacity="0.7"/>
  <circle cx="720" cy="25" r="1.5" fill="#00D9C0" opacity="0.8"/>

  <!-- pipes group, scrolling -->
  <g>
    <g>
      <rect x="0" y="0" width="50" height="70" fill="#6C63FF" rx="4"/>
      <rect x="-5" y="60" width="60" height="16" fill="#00D9C0" rx="3"/>
      <rect x="0" y="140" width="50" height="60" fill="#6C63FF" rx="4"/>
      <rect x="-5" y="140" width="60" height="16" fill="#00D9C0" rx="3"/>
      <animateTransform attributeName="transform" type="translate"
        from="800 0" to="-60 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="0" width="50" height="110" fill="#6C63FF" rx="4"/>
      <rect x="-5" y="100" width="60" height="16" fill="#00D9C0" rx="3"/>
      <rect x="0" y="180" width="50" height="20" fill="#6C63FF" rx="4"/>
      <rect x="-5" y="180" width="60" height="16" fill="#00D9C0" rx="3"/>
      <animateTransform attributeName="transform" type="translate"
        from="1200 0" to="-60 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="0" width="50" height="40" fill="#6C63FF" rx="4"/>
      <rect x="-5" y="30" width="60" height="16" fill="#00D9C0" rx="3"/>
      <rect x="0" y="110" width="50" height="90" fill="#6C63FF" rx="4"/>
      <rect x="-5" y="110" width="60" height="16" fill="#00D9C0" rx="3"/>
      <animateTransform attributeName="transform" type="translate"
        from="1600 0" to="-60 0" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bird -->
  <g>
    <ellipse cx="150" cy="100" rx="16" ry="12" fill="#00D9C0"/>
    <circle cx="158" cy="96" r="2.5" fill="#0B0B12"/>
    <polygon points="164,100 178,96 164,106" fill="#FFB800"/>
    <path d="M138 100 Q128 94 136 88 Q146 92 138 100" fill="#6C63FF">
      <animate attributeName="d"
        values="M138 100 Q128 94 136 88 Q146 92 138 100;
                M138 100 Q128 108 136 112 Q146 106 138 100;
                M138 100 Q128 94 136 88 Q146 92 138 100"
        dur="0.5s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -18; 0 0; 0 14; 0 0" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- ground -->
  <rect x="0" y="192" width="800" height="8" fill="#00D9C0" opacity="0.3"/>
</svg>
